# ./env.yaml

name: MERIT
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch-cuda=11.8
  - protobuf
  - pip:
      - accelerate 
      - bitsandbytes 
      - transformers 
      - sentencepiece 
      - scikit-learn
      - pandas 
      - numpy
      - tqdm
      - matplotlib 
      - huggingface_hub
      - sktime