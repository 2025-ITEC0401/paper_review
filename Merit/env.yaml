name: MERIT
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch-cuda=11.8 # CUDA 11.8 버전에 맞는 PyTorch 설치
  - protobuf
  - pip:
      - accelerate # LLM 로딩 및 분산 학습 가속
      - bitsandbytes # 4/8비트 양자화를 통해 LLM 메모리 사용량 최적화
      - transformers # Hugging Face LLM 모델(Llama 3.1) 로딩
      - sentencepiece # Llama 토크나이저에 필요
      - scikit-learn
      - pandas # 데이터 전처리
      - numpy
      - tqdm
      - matplotlib # 결과 시각화
      - tsai # 시계열 처리에 유용한 PyTorch 기반 라이브러리 (TCN 인코더 등 포함)
      - huggingface_hub # Hugging Face 모델 및 데이터셋 다운로드
